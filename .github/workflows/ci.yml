name: Windows verification

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.6
          uv lock --check
          uv sync --locked --group nuke
      - name: Validate tracked data
        shell: pwsh
        run: |
          $databases = git ls-files -- '*.sqlite' '*.sqlite3' '*.db' '*.sqlite-*' '*.sqlite3-*' '*.db-*'
          if ($databases) { throw 'Local databases must stay out of Git' }
      - name: Lint and test
        run: |
          uv run --no-sync ruff check src tests scripts integrations
          uv run --no-sync pytest -m 'not live'
      - name: Verify MCP entry points
        env:
          FX_AGENT_DATA_ROOT: "${{ runner.temp }}/fx-agent-cache"
        run: |
          uv run --no-sync python scripts/check_houdini.py --mcp-only
          uv run --no-sync python scripts/check_nuke.py --mock
      - name: Build and inspect artifacts
        run: |
          uv build --no-sources
          @'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel, = Path("dist").glob("*.whl")
          source, = Path("dist").glob("*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              assert "fx_agent/shared_experiences.json" in archive.namelist()
              assert not any(name.endswith((".sqlite", ".sqlite3", ".db")) for name in archive.namelist())
          with tarfile.open(source) as archive:
              assert any(name.endswith("/src/fx_agent/shared_experiences.json") for name in archive.getnames())
              assert not any(name.endswith((".sqlite", ".sqlite3", ".db")) for name in archive.getnames())
          '@ | python -
